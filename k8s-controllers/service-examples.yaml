# Service examples for Maven Web App
---
apiVersion: v1
kind: Service
metadata:
  name: maven-webapp-nodeport
spec:
  type: NodePort
  selector:
    app: maven-webapp
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: maven-webapp-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: maven-webapp
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: maven-webapp-clusterip
spec:
  type: ClusterIP
  selector:
    app: maven-webapp
  ports:
  - port: 80
    targetPort: 8080
---
kubectl apply -f service-examples.yaml
kubectl get svc maven-webapp-nodeport
kubectl get pods -l app=maven-webapp  # Should show pods selected by service

